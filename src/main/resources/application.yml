spring:
  application:
    name: ledger
  datasource:
    url: ${LEDGER_DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${LEDGER_DB_USER:ledger}
    password: ${LEDGER_DB_PASSWORD:ledger}
    hikari:
      maximum-pool-size: 20
  jooq:
    sql-dialect: postgres
  kafka:
    bootstrap-servers: ${LEDGER_KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
    consumer:
      auto-offset-reset: earliest
      properties:
        isolation.level: read_committed
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

ledger:
  transfers:
    locking: ${LEDGER_LOCKING:pessimistic}
    optimistic:
      max-attempts: 30
      initial-backoff: 2ms
      max-backoff: 100ms
  events:
    topic: transfer-events
    partitions: 3
    relay:
      enabled: true
      poll-interval-ms: 200
      batch-size: 100
      retention: 7d
  statement:
    projection:
      enabled: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,reconciliation
  endpoint:
    health:
      probes:
        enabled: true
